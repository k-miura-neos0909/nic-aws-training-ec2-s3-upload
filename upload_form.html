<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>画像アップロード</title>
</head>
<body>
    <h2>画像アップロード</h2>
    
    <form id="uploadForm">
        <input type="file" id="imageInput" accept="image/jpeg, image/png, image/gif, image/webp" required>
        <button type="submit">送信</button>
    </form>

    <p id="message"></p>
    
    <p id="urlContainer" style="display: none;">
        <strong>S3 ファイル URL:</strong><br>
        <a id="s3Url" href="" target="_blank"></a>
    </p>

    <img id="preview" width="300" style="display: none;">

    <script>
    document.getElementById('uploadForm').onsubmit = async (e) => {
        e.preventDefault();
        
        const fileInput = document.getElementById('imageInput');
        if (!fileInput.files[0]) return;

        const formData = new FormData();
        formData.append('image', fileInput.files[0]);

        document.getElementById('message').textContent = '送信中...';
        
        // 前回の表示をクリア
        document.getElementById('urlContainer').style.display = 'none';
        document.getElementById('preview').style.display = 'none';

        try {
            const res = await fetch('api.php', { method: 'POST', body: formData });
            const data = await res.json();

            document.getElementById('message').textContent = data.message;
            
            // ★ URLと画像プレビューを設定して表示 ★
            if (data.url) {
                const urlLink = document.getElementById('s3Url');
                urlLink.href = data.url;
                urlLink.textContent = data.url;
                document.getElementById('urlContainer').style.display = 'block';

                const previewImg = document.getElementById('preview');
                previewImg.src = data.url;
                previewImg.style.display = 'block';
            }
        } catch (err) {
            document.getElementById('message').textContent = 'エラーが発生しました。';
        }
    };
    </script>
</body>
</html>
